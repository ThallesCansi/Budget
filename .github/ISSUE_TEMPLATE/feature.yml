name: ✨ Funcionalidade
description: Sugira uma melhoria ou recurso novo
labels: ["type:feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
  - type: dropdown
    id: area
    attributes:
      label: Área
      multiple: true
      options: ["web", "api", "infra"]
