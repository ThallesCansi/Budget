name: E2E

on:
  pull_request:
    paths: ["apps/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/e2e.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budget
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/budget
      SUPABASE_URL: http://127.0.0.1:54399
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mock-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - name: Start API
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - run: pnpm --filter @budget/web build
      - run: pnpm --filter @budget/web exec playwright install --with-deps chromium
      - run: pnpm --filter @budget/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/api/api.log
